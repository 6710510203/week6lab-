<!DOCTYPE html>
<html>
<head>
<title>ร้านน้ำหอม</title>
<style>
body{margin:0;text-align:center;font-family:Arial;background:#fff5f5}
nav{padding:20px;background:white}
nav b{color:#d66b7a;font-size:22px}
nav a{margin:15px;color:#555;text-decoration:none}
.hero{margin:30px auto;padding:60px 20px;width:80%;border-radius:20px;background:#d66b7a;color:white}
button{padding:10px 20px;border:0;border-radius:20px;background:#a84f5e;color:white}
.menu{padding:30px}
.food{display:flex;justify-content:center;gap:20px}
.card{background:white;width:200px;padding:15px;border-radius:15px}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.card h3{color:#a84f5e}
.card p{color:#d66b7a;font-weight:bold}
footer{padding:20px;background:#a84f5e;color:white}
</style>
</head>
<body>
<nav>
<b>Fresh Scent</b>
<a href="#">หน้าแรก</a>
<a href="#menu">น้ำหอม</a>
</nav>
<div class="hero">
<h1>Fresh Scent</h1>
<p>น้ำหอมกลิ่นหอม ๆ สำหรับทุกวัน</p>
<button onclick="go()">เลือกน้ำหอม</button>
</div>
<div class="menu" id="menu">
<h1>น้ำหอมของเรา</h1>
<div class="food">
<div class="card">
<img src="https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc">
<h3>Rose Perfume</h3><p>฿890</p><button>ซื้อเลย</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539">
<h3>Vanilla Perfume</h3><p>฿790</p><button>ซื้อเลย</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1595425970377-c9703cf48b6d">
<h3>Ocean Perfume</h3><p>฿690</p><button>ซื้อเลย</button>
</div>
</div>
</div>
<footer>Fresh Scent © 2026</footer>
<script>
function go(){document.getElementById("menu").scrollIntoView();}
</script>
</body>
</html>
